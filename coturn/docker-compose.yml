# Production TURN for RICHAT voice. Run on a Linux host with a public IP.
# Docker Desktop (macOS) does not support network_mode: host; local voice
# does not need TURN.
#
#   cp .env.example .env
#   # set TURN_PASS and TURN_EXTERNAL_IP
#   docker compose --env-file .env --project-name richat-turn up -d
#
# DNS: A record turn.example.com -> TURN_EXTERNAL_IP
# Firewall: UDP/TCP 3478, UDP 49152-49200
# App env: see ../docs/turn.md

services:
  coturn:
    image: coturn/coturn:4.6.3
    container_name: richat-coturn
    restart: unless-stopped
    network_mode: host
    command:
      # No stdout logging: coturn allocation logs record client IP addresses.
      # Re-enable temporarily with --log-file=stdout --simple-log to debug.
      - --no-stdout-log
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=${TURN_USER}:${TURN_PASS}
      - --realm=${TURN_REALM}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --min-port=49152
      - --max-port=49200
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=::1
